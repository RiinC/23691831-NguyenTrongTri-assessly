name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Services
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Prepare .env for docker-compose (fall back to internal compose services when secrets not provided)
      - name: Create compose .env
        run: |
          cat > .env <<EOF
          MONGODB_AUTH_URI=${{ secrets.MONGODB_AUTH_URI || 'mongodb://mongo:27017/auth_test' }}
          MONGODB_PRODUCT_URI=${{ secrets.MONGODB_PRODUCT_URI || 'mongodb://mongo:27017/product_test' }}
          MONGODB_ORDER_URI=${{ secrets.MONGODB_ORDER_URI || 'mongodb://mongo:27017/order_test' }}
          RABBITMQ_URI=${{ secrets.RABBITMQ_URI || 'amqp://rabbitmq:5672' }}
          JWT_SECRET=${{ secrets.JWT_SECRET || 'testsecret' }}
          AUTH_SERVICE_URL=${{ secrets.AUTH_SERVICE_URL || 'http://api-gateway:3003' }}
          EOF

      - name: Build and start services (compose)
        run: |
          docker-compose up -d --build

      - name: Wait for Mongo (via auth container)
        run: |
          for i in $(seq 1 30); do
            docker-compose exec -T auth node -e "const net=require('net');const s=net.createConnection({host:'mongo',port:27017},()=>{console.log('ok');s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)" >/dev/null 2>&1 && echo 'Mongo ready' && exit 0 || true
            echo "Waiting for Mongo... ($i)"; sleep 2
          done
          echo 'Mongo did not become ready'; docker-compose logs mongo; docker-compose logs auth; exit 1

      - name: Run auth tests (in-container)
        run: docker-compose run --rm auth npm test

      - name: Run product tests (in-container)
        run: docker-compose run --rm product npm test

      - name: Tear down compose (tests)
        if: always()
        run: docker-compose down -v

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cat > .env << EOF
          MONGODB_AUTH_URI=${{ secrets.MONGODB_AUTH_URI }}
          MONGODB_ORDER_URI=${{ secrets.MONGODB_ORDER_URI }}
          MONGODB_PRODUCT_URI=${{ secrets.MONGODB_PRODUCT_URI }}
          RABBITMQ_URI=${{ secrets.RABBITMQ_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          AUTH_SERVICE_URL=${{ secrets.AUTH_SERVICE_URL }}
          EOF

      - name: Build with Docker Compose
        run: docker-compose build

      - name: Start Services
        run: |
          docker-compose up -d
          sleep 20

      - name: Check Services
        run: |
          docker-compose ps
          docker-compose logs

      - name: Stop Services
        if: always()
        run: docker-compose down -v

  deploy:
    name: Push Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and Push
        run: |
          docker buildx build --push -t ghcr.io/${{ github.actor }}/auth:latest ./auth
          docker buildx build --push -t ghcr.io/${{ github.actor }}/product:latest ./product
          docker buildx build --push -t ghcr.io/${{ github.actor }}/order:latest ./order
          docker buildx build --push -t ghcr.io/${{ github.actor }}/gateway:latest ./api-gateway