name: CI/CD Pipeline with Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx for building images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Login to Docker Hub (using GitHub Secrets for credentials)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }}    

      # Step 4: Login to GitHub Container Registry (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.GH_ACTOR }}  
          password: ${{ secrets.GH_TOKEN }}    

      # Step 5: Install Docker Compose (since it may not be installed on the runner)
      - name: Install Docker Compose
        run: |
          curl -L https://github.com/docker/compose/releases/download/v2.10.0/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version  # Verify Docker Compose installation

      # Step 6: Set up environment variables from GitHub Secrets
      - name: Set up environment variables
        run: |
          echo "MONGODB_AUTH_URI=${{ secrets.MONGODB_AUTH_URI }}" >> $GITHUB_ENV
          echo "MONGODB_ORDER_URI=${{ secrets.MONGODB_ORDER_URI }}" >> $GITHUB_ENV
          echo "MONGODB_PRODUCT_URI=${{ secrets.MONGODB_PRODUCT_URI }}" >> $GITHUB_ENV
          echo "RABBITMQ_URI=${{ secrets.RABBITMQ_URI }}" >> $GITHUB_ENV
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
          echo "AUTH_SERVICE_URL=${{ secrets.AUTH_SERVICE_URL }}" >> $GITHUB_ENV

      # Step 7: Build Docker images for each service
      - name: Build Docker images
        run: |
          docker-compose -f docker-compose.yml build

      # Step 8: Push Docker images to Docker Hub and GHCR
      - name: Push Docker images to Docker Hub and GHCR
        run: |
          docker-compose -f docker-compose.yml push

  test:
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Compose
      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v2

      # Step 3: Run Docker Compose to start services
      - name: Run services with Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d

      # Step 4: Run health checks (if applicable, check if services are available)
      - name: Run health checks (check ports)
        run: |
          echo "Checking if api-gateway is listening on port 3003..."
          nc -zv localhost 3003 || exit 1
          
          echo "Checking if auth service is listening on port 3000..."
          nc -zv localhost 3000 || exit 1

          echo "Health checks passed."

      # Step 5: Shut down Docker Compose
      - name: Shut down Docker Compose
        run: |
          docker-compose -f docker-compose.yml down
