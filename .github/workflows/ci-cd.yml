name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Services
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and Test Auth
        working-directory: ./auth
        run: |
          npm ci
          npm test
        env:
          MONGODB_AUTH_URI: ${{ secrets.MONGODB_AUTH_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RABBITMQ_URI: ${{ secrets.RABBITMQ_URI }}

      - name: Install and Test Product
        working-directory: ./product
        run: |
          npm ci
          npm test
        env:
          MONGODB_PRODUCT_URI: ${{ secrets.MONGODB_PRODUCT_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RABBITMQ_URI: ${{ secrets.RABBITMQ_URI }}
          AUTH_SERVICE_URL: ${{ secrets.AUTH_SERVICE_URL }}

      - name: Run auth tests
        run: |
          # small wait to let database start accepting connections
          sleep 5
          docker compose run --rm auth npm test

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cat > .env << EOF
          MONGODB_AUTH_URI=${{ secrets.MONGODB_AUTH_URI }}
          MONGODB_ORDER_URI=${{ secrets.MONGODB_ORDER_URI }}
          MONGODB_PRODUCT_URI=${{ secrets.MONGODB_PRODUCT_URI }}
          RABBITMQ_URI=${{ secrets.RABBITMQ_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          AUTH_SERVICE_URL=${{ secrets.AUTH_SERVICE_URL }}
          EOF

      - name: Build with Docker Compose
        run: docker-compose build

      - name: Start Services
        run: |
          docker-compose up -d
          sleep 20

      - name: Check Services
        run: |
          docker-compose ps
          docker-compose logs

      - name: Stop Services
        if: always()
        run: docker-compose down -v

  deploy:
    name: Push Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and Push
        run: |
          docker buildx build --push -t ghcr.io/${{ github.actor }}/auth:latest ./auth
          docker buildx build --push -t ghcr.io/${{ github.actor }}/product:latest ./product
          docker buildx build --push -t ghcr.io/${{ github.actor }}/order:latest ./order
          docker buildx build --push -t ghcr.io/${{ github.actor }}/gateway:latest ./api-gateway