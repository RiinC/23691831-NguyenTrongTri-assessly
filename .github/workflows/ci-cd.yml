name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup .env files from GitHub Secrets
      - name: Setup .env files
        run: |
          # Auth service
          cat > auth/.env <<EOF
          MONGODB_AUTH_URI=${{ secrets.MONGODB_AUTH_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          RABBITMQ_URI=${{ secrets.RABBITMQ_URI }}
          EOF

          # Product service
          cat > product/.env <<EOF
          MONGODB_PRODUCT_URI=${{ secrets.MONGODB_PRODUCT_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          RABBITMQ_URI=${{ secrets.RABBITMQ_URI }}
          AUTH_SERVICE_URL=http://auth:3000
          LOGIN_TEST_USER=${{ secrets.LOGIN_TEST_USER }}
          LOGIN_TEST_PASSWORD=${{ secrets.LOGIN_TEST_PASSWORD }}
          EOF

          # Order service
          cat > order/.env <<EOF
          MONGODB_ORDER_URI=${{ secrets.MONGODB_ORDER_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          RABBITMQ_URI=${{ secrets.RABBITMQ_URI }}
          EOF

      # 3️⃣ Build & start services with Docker Compose
      - name: Build & start services
        run: |
          docker compose -f docker-compose.yml up -d --build

      # 4️⃣ Wait for Auth Service to become healthy
      - name: Wait for Auth Service
        run: |
          docker compose run --rm product sh -c "
            for i in \$(seq 1 30); do
              STATUS=\$(curl -s -o /dev/null -w '%{http_code}' http://auth:3000/health || true)
              if [ \"\$STATUS\" = \"200\" ]; then
                echo 'Auth ready' && exit 0
              fi
              echo 'Waiting for auth... (\$i)'; sleep 2
            done
            echo 'Auth did not become ready'; exit 1
          "

      # 5️⃣ Run product tests inside the product container
      - name: Run product tests
        run: |
          docker compose run --rm product sh -c "
            until curl -s http://auth:3000/health; do sleep 2; done
            npm test
          "

      # 6️⃣ Login to Docker Hub to push images
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7️⃣ Build & push images with Buildx (tagged with sha and latest)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build and push images for each service
      - name: Build and push auth image
        uses: docker/build-push-action@v4
        with:
          context: ./auth
          file: ./auth/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/auth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/auth:${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push product image
        uses: docker/build-push-action@v4
        with:
          context: ./product
          file: ./product/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product:${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push order image
        uses: docker/build-push-action@v4
        with:
          context: ./order
          file: ./order/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/order:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/order:${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push api-gateway image
        uses: docker/build-push-action@v4
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}
          platforms: linux/amd64

      # 8️⃣ Tear down Docker Compose
      - name: Tear down Docker Compose
        if: always()
        run: docker compose down --volumes
