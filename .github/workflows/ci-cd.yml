name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Services
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Prepare .env for docker-compose with fallback values
      - name: Create compose .env
        run: |
          echo "MONGODB_AUTH_URI=${{ secrets.MONGODB_AUTH_URI }}" > .env
          echo "MONGODB_PRODUCT_URI=${{ secrets.MONGODB_PRODUCT_URI }}" >> .env
          echo "MONGODB_ORDER_URI=${{ secrets.MONGODB_ORDER_URI }}" >> .env
          echo "RABBITMQ_URI=${{ secrets.RABBITMQ_URI }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "AUTH_SERVICE_URL=${{ secrets.AUTH_SERVICE_URL }}" >> .env          

      - name: Build and start services
        run: |
          docker compose up -d --build

      - name: Wait for Mongo
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T auth sh -c "node -e \"const net=require('net');const s=net.createConnection({host:'mymongodb',port:27017},()=>{console.log('ok');s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)\"" >/dev/null 2>&1 && echo 'Mongo ready' && exit 0 || true
            echo "Waiting for Mongo... ($i)"; sleep 2
          done
          echo 'Mongo did not become ready'; docker compose logs mymongodb; docker compose logs auth; exit 1

      - name: Run auth tests
        run: docker compose run --rm auth npm test

      - name: Wait for Auth service
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T auth sh -c "
              node -e \"
                const net = require('net');
                const s = net.createConnection({ host: 'auth', port: 3000 }, () => { 
                  console.log('Auth ready'); 
                  s.end(); 
                  process.exit(0); 
                });
                s.on('error', () => process.exit(1));
                setTimeout(() => process.exit(1), 3000);
              \"
            " >/dev/null 2>&1 && echo 'Auth ready' && exit 0 || true
            echo "Waiting for Auth service... ($i)"
            sleep 2
          done
          echo 'Auth service did not become ready'
          docker compose logs auth
          exit 1
      - name: Run product tests
        run: docker compose run --rm product npm test

      - name: Tear down compose
        if: always()
        run: docker compose down -v

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "MONGODB_AUTH_URI=${{ secrets.MONGODB_AUTH_URI }}" > .env
          echo "MONGODB_ORDER_URI=${{ secrets.MONGODB_ORDER_URI }}" >> .env
          echo "MONGODB_PRODUCT_URI=${{ secrets.MONGODB_PRODUCT_URI }}" >> .env
          echo "RABBITMQ_URI=${{ secrets.RABBITMQ_URI }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "AUTH_SERVICE_URL=${{ secrets.AUTH_SERVICE_URL }}" >> .env

      - name: Build with Docker Compose
        run: docker compose build

      - name: Start Services
        run: |
          docker compose up -d
          # Wait for all services to be healthy
          for i in $(seq 1 30); do
            STATUS=$(docker compose ps --services --filter "status=running" | wc -l)
            if [ "$STATUS" -ge 5 ]; then
              echo "All services running"; break
            fi
            echo "Waiting for services... ($i)"; sleep 2
          done

      - name: Check Services
        run: |
          docker compose ps
          docker compose logs --tail=20

      - name: Stop Services
        if: always()
        run: docker compose down -v

  deploy:
    name: Push Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and Push
        run: |
          actor_lower=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build --push -t ghcr.io/${actor_lower}/auth:latest ./auth
          docker buildx build --push -t ghcr.io/${actor_lower}/product:latest ./product
          docker buildx build --push -t ghcr.io/${actor_lower}/order:latest ./order
          docker buildx build --push -t ghcr.io/${actor_lower}/gateway:latest ./api-gateway
