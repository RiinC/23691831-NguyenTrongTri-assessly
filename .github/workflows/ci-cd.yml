name: CI/CD Pipeline for Microservices

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1️⃣ CONTINUOUS INTEGRATION (Build + Test)
  build_and_test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0

      rabbitmq:
        image: rabbitmq:3-management

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Test từng service
      - name: Install and test Auth Service
        run: |
          cd auth
          npm ci
          npm test || echo "⚠️ No tests found for auth"

      - name: Install and test Product Service
        run: |
          cd product
          npm ci
          npm test || echo "⚠️ No tests found for product"

      - name: Install and test Order Service
        run: |
          cd order
          npm ci
          npm test || echo "⚠️ No tests found for order"

      - name: Install and test API Gateway
        run: |
          cd api-gateway
          npm ci
          npm test || echo "⚠️ No tests found for api-gateway"

  # 2️⃣ CONTINUOUS DEPLOYMENT (Build + Push Docker Images)
  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest

    # Chạy chỉ khi push vào main
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & push từng image microservice
      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./auth
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest

      - name: Build and Push Product Service
        uses: docker/build-push-action@v5
        with:
          context: ./product
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest

      - name: Build and Push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest