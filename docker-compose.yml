services:
  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - micro_network
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # MongoDB
  mymongodb:
    image: mongo:7.0
    container_name: mymongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - micro_network
    healthcheck:
      test: [ "CMD-SHELL", "mongostat --rowcount 1 --quiet || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Auth Service
  auth:
    build:
      context: ./auth
    container_name: auth
    depends_on:
      rabbitmq:
        condition: service_healthy
      mymongodb:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: always
    networks:
      - micro_network
    environment:
      MONGODB_AUTH_URI: ${MONGODB_AUTH_URI}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URI: ${RABBITMQ_URI}
    command: sh -c "sleep 5 && npm start"

  # Product Service
  product:
    build:
      context: ./product
    container_name: product
    depends_on:
      rabbitmq:
        condition: service_healthy
      mymongodb:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: always
    networks:
      - micro_network
    environment:
      MONGODB_PRODUCT_URI: ${MONGODB_PRODUCT_URI}
      RABBITMQ_URI: ${RABBITMQ_URI}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    command: sh -c "sleep 5 && npm start"

  # Order Service
  order:
    build:
      context: ./order
    container_name: order
    depends_on:
      rabbitmq:
        condition: service_healthy
      mymongodb:
        condition: service_healthy
    ports:
      - "3002:3002"
    restart: always
    networks:
      - micro_network
    environment:
      MONGODB_ORDER_URI: ${MONGODB_ORDER_URI}
      RABBITMQ_URI: ${RABBITMQ_URI}
      JWT_SECRET: ${JWT_SECRET}
    command: sh -c "sleep 5 && npm start"

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    depends_on:
      auth:
        condition: service_started
      order:
        condition: service_started
      product:
        condition: service_started
    ports:
      - "3003:3003"
    restart: always
    networks:
      - micro_network

volumes:
  mongo_data:


networks:
  micro_network:
    driver: bridge
